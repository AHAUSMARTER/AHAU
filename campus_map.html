<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园地图与步行导航 · 安农智办</title><link rel="stylesheet" href="campus_map.css"><script src="campus_map.js?v=4" defer></script></head>
<body><header><a href="index.html" class="brand">徽农智 <span>安农智办</span></a><a href="index.html">返回工作台</a></header>
<main><section class="intro"><div><p class="eyebrow">安徽农业大学 · 长江西路校区</p><h1>找到目的地，走对每一步。</h1><p>搜索校园地点，查看高德地图与步行路线，也可以对照校园方位图。</p></div><span class="tag">地图数据来自高德</span></section>
<div class="workspace"><aside><form id="search-form"><label for="keyword">你想去哪里？</label><div class="search-row"><input id="keyword" name="q" placeholder="例如：图书馆、勤学楼" maxlength="60" required><button type="submit">搜索</button></div></form><div class="quick" aria-label="常用地点"><button type="button" data-query="安徽农业大学图书馆">图书馆</button><button type="button" data-query="安徽农业大学勤学楼">勤学楼</button><button type="button" data-query="安徽农业大学勤政楼">勤政楼</button><button type="button" data-query="安徽农业大学学生宿舍北区">北区宿舍</button></div>
<p id="search-status" role="status" class="muted">选择常用地点，或输入名称开始搜索。</p><div id="results" aria-label="地点查询结果"></div>
<section class="route-box"><h2>步行路线</h2><label for="origin">起点</label><input id="origin" placeholder="从结果设为起点，或使用我的位置" readonly><button id="locate" type="button" class="secondary">使用我的位置</button><label for="destination">终点</label><input id="destination" placeholder="从搜索结果选择目的地" readonly><button id="plan" type="button" disabled>规划步行路线</button><a id="navigate" class="button secondary" target="_blank" rel="noopener" hidden>打开高德导航</a><p id="route-status" role="status" class="muted">路线与时间由高德返回，实际通行以校园现场为准。</p><div id="route-panel"></div></section></aside>
<section class="map-column" aria-label="地图展示"><div class="view-tabs" role="group" aria-label="地图类型"><button data-view="live" aria-pressed="true">高德地图</button><button data-view="main" aria-pressed="false">主校区方位图</button><button data-view="north" aria-pressed="false">北区宿舍方位图</button></div><p id="map-status" role="status" class="map-message">正在连接地图服务…</p><div id="live-view"><div id="map" aria-label="可交互高德地图"></div></div><div id="image-view" hidden><div class="image-toolbar"><button id="zoom-out" aria-label="缩小地图">缩小</button><button id="zoom-reset">还原</button><button id="zoom-in" aria-label="放大地图">放大</button><a id="original" target="_blank" rel="noopener">查看原图</a></div><div id="image-scroll" tabindex="0" aria-label="校园原图，可滚动查看"><img id="campus-image" alt="安徽农业大学校园方位图"></div><p class="muted">来自项目现有校园方位图；图片未标注更新日期，建筑用途与名称以校方最新信息为准。方位图不用于计算步行路线。</p></div></section></div>
<footer>地点坐标与路线均由地图服务查询，不由大模型生成。搜索结果请核对校区和地址；校园小路、围墙及校门开放情况可能与地图不同。定位仅在点击后请求，不上传到本项目数据库。</footer></main></body></html>
