[build]
  publish = "public"

[[edge_functions]]
  function = "map-proxy"
  path = "/health"

[[edge_functions]]
  function = "map-proxy"
  path = "/config"

[[edge_functions]]
  function = "map-proxy"
  path = "/_AMapService/*"

[[edge_functions]]
  function = "school-model"
  path = "/model/health"

[[edge_functions]]
  function = "school-model"
  path = "/model/chat"

[[edge_functions]]
  function = "school-model"
  path = "/model/browser-config"

[[headers]]
  for = "/ocr/v1/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"
